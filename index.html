<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proximity Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<style>
body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 24px 0;
  font-size: 32px;
}

/* LOGIN CARD — BIG ON PURPOSE */
.card {
  background: #1c1c1c;
  padding: 32px;
  width: 92%;
  max-width: 460px; /* 👈 bigger overall */
  margin: 40px auto;
  border-radius: 22px;
}

/* INPUTS SCALE WITH CARD */
input {
  width: 100%;
  padding: 18px;
  margin: 14px 0;
  border-radius: 14px;
  border: none;
  font-size: 20px;
  box-sizing: border-box; /* 👈 THIS fixes fitting */
}

/* BUTTONS SCALE TOO */
button {
  width: 100%;
  padding: 18px;
  margin-top: 16px;
  border: none;
  border-radius: 16px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

#joinBtn {
  background: #4caf50;
  color: black;
}

#muteBtn {
  display: none;
  background: #e91e63;
  color: white;
  max-width: 260px;
  margin: 24px auto;
}

#app { display: none; }

/* GROUPS */
.dimensions {
  display: flex;
  gap: 20px;
  max-width: 1200px;
  margin: 24px auto;
}

.dimension {
  flex: 1;
  padding: 18px;
  border-radius: 20px;
}

.overworld { background: #1f6f5f; }
.nether { background: #7a1f1f; }
.end { background: #4b2a6f; }

.dimension h2 {
  font-size: 22px;
}

.dimension button {
  background: white;
  margin: 10px 0;
  font-size: 18px;
}

/* PLAYERS */
#players {
  background: #1c1c1c;
  max-width: 560px;
  margin: 24px auto;
  padding: 18px;
  border-radius: 18px;
  font-size: 18px;
}

.player {
  background: #2a2a2a;
  padding: 12px;
  margin: 8px 0;
  border-radius: 12px;
  transition: 0.15s;
}

/* TALKING GLOW */
.talking {
  border: 3px solid #4caf50;
  box-shadow: 0 0 18px #4caf50;
}
</style>
</head>

<body>

<h1>Proximity Chat</h1>

<!-- LOGIN -->
<div class="card" id="login">
  <input id="username" placeholder="Minecraft Username">
  <input id="password" type="password" placeholder="Room Password">
  <button id="joinBtn">Join Server</button>
</div>

<button id="muteBtn">Mute Mic</button>
<div id="app"></div>

<script>
const ROOM_PASSWORD = "BMS Minecraft";
const firebaseConfig = {
  apiKey: "AIzaSyCR0kIMG1QJzWMUh52UYduYoL9a-f_Db-w",
  authDomain: "proximity-chat-95107.firebaseapp.com",
  databaseURL: "https://proximity-chat-95107-default-rtdb.firebaseio.com",
  projectId: "proximity-chat-95107",
  storageBucket: "proximity-chat-95107.appspot.com",
  messagingSenderId: "347116592936",
  appId: "1:347116592936:web:4eb61da00f475c73a3fa1d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let name="", stream, peer, currentGroup="", calls={}, muted=false;
let analyser, dataArray;

joinBtn.onclick = async () => {
  if (password.value !== ROOM_PASSWORD) return alert("Wrong password");
  name = username.value.trim();
  if (!name) return alert("Enter username");

  stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  setupVoiceDetection(stream);

  peer = new Peer();
  peer.on("call", c => {
    c.answer(stream);
    c.on("stream", s => playAudio(s, c.peer));
  });

  login.remove();
  muteBtn.style.display = "block";
  app.style.display = "block";
  renderApp();
};

muteBtn.onclick = () => {
  muted = !muted;
  stream.getAudioTracks()[0].enabled = !muted;
  muteBtn.textContent = muted ? "Unmute Mic" : "Mute Mic";
};

function renderApp() {
  app.innerHTML = `
    <div class="dimensions">
      ${dim("Overworld","overworld")}
      ${dim("Nether","nether")}
      ${dim("End","end")}
    </div>
    <div id="players">
      <strong>Players in group</strong>
      <div id="playerList">Not in a group</div>
    </div>
  `;
  document.querySelectorAll("[data-g]").forEach(b=>{
    b.onclick=()=>joinGroup(b.dataset.g);
  });
}

function dim(n,c){
  return `<div class="dimension ${c}">
    <h2>${n}</h2>
    <button data-g="${n}/1">Group 1</button>
    <button data-g="${n}/2">Group 2</button>
    <button data-g="${n}/3">Group 3</button>
  </div>`;
}

function joinGroup(g){
  leaveGroup();
  currentGroup=g;
  const ref=db.ref("groups/"+g+"/"+name);
  ref.set({peer:peer.id,talking:false});
  ref.onDisconnect().remove();

  db.ref("groups/"+g).on("value",s=>{
    const list=document.getElementById("playerList");
    list.innerHTML="";
    const u=s.val()||{};
    Object.keys(u).forEach(p=>{
      const d=document.createElement("div");
      d.className="player"+(u[p].talking?" talking":"");
      d.textContent=p;
      list.appendChild(d);
      if(p!==name&&!calls[p]){
        const c=peer.call(u[p].peer,stream);
        calls[p]=c;
        c.on("stream",st=>playAudio(st,u[p].peer));
      }
    });
  });
}

function leaveGroup(){
  Object.values(calls).forEach(c=>c.close());
  calls={};
  document.querySelectorAll("audio").forEach(a=>a.remove());
}

function playAudio(s,id){
  if(document.getElementById(id))return;
  const a=document.createElement("audio");
  a.id=id;a.srcObject=s;a.autoplay=true;
  document.body.appendChild(a);
}

function setupVoiceDetection(s){
  const ctx=new AudioContext();
  analyser=ctx.createAnalyser();
  const src=ctx.createMediaStreamSource(s);
  analyser.fftSize=256;
  src.connect(analyser);
  dataArray=new Uint8Array(analyser.frequencyBinCount);
  (function loop(){
    analyser.getByteFrequencyData(dataArray);
    const v=dataArray.reduce((a,b)=>a+b)/dataArray.length;
    if(currentGroup&&name)
      db.ref("groups/"+currentGroup+"/"+name+"/talking")
        .set(v>20&&!muted);
    requestAnimationFrame(loop);
  })();
}
</script>

</body>
</html>
