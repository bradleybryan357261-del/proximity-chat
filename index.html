<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proximity Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<style>
body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { margin: 20px 0; }

/* LOGIN (mobile friendly) */
.card {
  background: #1c1c1c;
  padding: 24px;
  max-width: 420px;
  margin: 30px auto;
  border-radius: 18px;
}

input {
  width: 100%;
  padding: 16px;
  margin: 10px 0;
  border-radius: 12px;
  border: none;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#joinBtn { background: #4caf50; color: black; }

#muteBtn {
  display: none;
  background: #e91e63;
  color: white;
  max-width: 240px;
  margin: 20px auto;
}

#app { display: none; }

/* GROUPS */
.dimensions {
  display: flex;
  gap: 20px;
  max-width: 1200px;
  margin: 20px auto;
}

.dimension {
  flex: 1;
  padding: 16px;
  border-radius: 18px;
}

.overworld { background: #1f6f5f; }
.nether { background: #7a1f1f; }
.end { background: #4b2a6f; }

.dimension button {
  background: white;
  margin: 8px 0;
}

/* PLAYERS */
#players {
  background: #1c1c1c;
  max-width: 520px;
  margin: 20px auto;
  padding: 16px;
  border-radius: 16px;
}

.player {
  background: #2a2a2a;
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
  transition: 0.15s;
}

/* TALKING GLOW */
.talking {
  border: 2px solid #4caf50;
  box-shadow: 0 0 14px #4caf50;
}
</style>
</head>

<body>

<h1>Proximity Chat</h1>

<!-- LOGIN -->
<div class="card" id="login">
  <input id="username" placeholder="Minecraft Username">
  <input id="password" type="password" placeholder="Room Password">
  <button id="joinBtn">Join Server</button>
</div>

<button id="muteBtn">Mute Mic</button>

<div id="app"></div>

<script>
/* CONFIG */
const ROOM_PASSWORD = "BMS Minecraft";
const firebaseConfig = {
  apiKey: "AIzaSyCR0kIMG1QJzWMUh52UYduYoL9a-f_Db-w",
  authDomain: "proximity-chat-95107.firebaseapp.com",
  databaseURL: "https://proximity-chat-95107-default-rtdb.firebaseio.com",
  projectId: "proximity-chat-95107",
  storageBucket: "proximity-chat-95107.appspot.com",
  messagingSenderId: "347116592936",
  appId: "1:347116592936:web:4eb61da00f475c73a3fa1d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let name = "";
let stream;
let peer;
let currentGroup = "";
let calls = {};
let muted = false;
let analyser, dataArray;

/* LOGIN */
joinBtn.onclick = async () => {
  if (password.value !== ROOM_PASSWORD) return alert("Wrong password");
  name = username.value.trim();
  if (!name) return alert("Enter username");

  stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  setupVoiceDetection(stream);

  peer = new Peer();
  peer.on("call", call => {
    call.answer(stream);
    call.on("stream", s => playAudio(s, call.peer));
  });

  login.remove();
  muteBtn.style.display = "block";
  app.style.display = "block";

  renderApp();
};

/* MUTE */
muteBtn.onclick = () => {
  muted = !muted;
  stream.getAudioTracks()[0].enabled = !muted;
  muteBtn.textContent = muted ? "Unmute Mic" : "Mute Mic";
};

/* UI */
function renderApp() {
  app.innerHTML = `
    <div class="dimensions">
      ${dimension("Overworld","overworld")}
      ${dimension("Nether","nether")}
      ${dimension("End","end")}
    </div>

    <div id="players">
      <strong>Players in group</strong>
      <div id="playerList">Not in a group</div>
    </div>
  `;

  document.querySelectorAll("[data-group]").forEach(b => {
    b.onclick = () => joinGroup(b.dataset.group);
  });
}

function dimension(name, cls) {
  return `
    <div class="dimension ${cls}">
      <h2>${name}</h2>
      <button data-group="${name}/1">Group 1</button>
      <button data-group="${name}/2">Group 2</button>
      <button data-group="${name}/3">Group 3</button>
    </div>
  `;
}

/* GROUP + VOICE */
function joinGroup(group) {
  leaveGroup();
  currentGroup = group;

  const ref = db.ref("groups/" + group + "/" + name);
  ref.set({ peer: peer.id, talking: false });
  ref.onDisconnect().remove();

  db.ref("groups/" + group).on("value", snap => {
    const list = document.getElementById("playerList");
    list.innerHTML = "";
    const users = snap.val() || {};

    Object.keys(users).forEach(u => {
      const div = document.createElement("div");
      div.className = "player" + (users[u].talking ? " talking" : "");
      div.textContent = u;
      list.appendChild(div);

      if (u !== name && !calls[u]) {
        const call = peer.call(users[u].peer, stream);
        calls[u] = call;
        call.on("stream", s => playAudio(s, users[u].peer));
      }
    });
  });
}

function leaveGroup() {
  Object.values(calls).forEach(c => c.close());
  calls = {};
  document.querySelectorAll("audio").forEach(a => a.remove());
}

/* AUDIO PLAY */
function playAudio(stream, id) {
  if (document.getElementById(id)) return;
  const a = document.createElement("audio");
  a.id = id;
  a.srcObject = stream;
  a.autoplay = true;
  document.body.appendChild(a);
}

/* TALKING DETECTION (works on phone + PC) */
function setupVoiceDetection(stream) {
  const ctx = new AudioContext();
  analyser = ctx.createAnalyser();
  const src = ctx.createMediaStreamSource(stream);
  analyser.fftSize = 256;
  src.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);

  function loop() {
    analyser.getByteFrequencyData(dataArray);
    const volume = dataArray.reduce((a,b)=>a+b) / dataArray.length;
    const talking = volume > 20 && !muted;

    if (currentGroup && name) {
      db.ref("groups/" + currentGroup + "/" + name + "/talking").set(talking);
    }
    requestAnimationFrame(loop);
  }
  loop();
}
</script>

</body>
</html>
