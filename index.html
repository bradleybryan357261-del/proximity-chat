<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proximity Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { margin: 30px 0; }

.card {
  background: #1c1c1c;
  padding: 20px;
  max-width: 360px;
  width: 100%;
  margin: 30px auto;
  border-radius: 14px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#joinBtn { background: #4caf50; color: black; }

#muteBtn {
  display: none;
  background: #e91e63;
  color: white;
  max-width: 200px;
  margin: 20px auto;
}

#app { display: none; }

/* 📱 PHONE — PROPER FIX */
@media (max-width: 600px) {
  body {
    padding: 0;
  }

  h1 {
    font-size: 48px;
    margin-top: 40px;
  }

  .card {
    max-width: none;
    width: 92%;
    margin: 40px auto;
    padding: 48px;
    border-radius: 32px;
  }

  input {
    font-size: 28px;
    padding: 26px;
    margin: 16px 0;
    border-radius: 18px;
  }

  button {
    font-size: 30px;
    padding: 28px;
    margin-top: 20px;
    border-radius: 22px;
  }
}

.dimensions {
  display: flex;
  gap: 20px;
  max-width: 1200px;
  margin: 30px auto;
}

.dimension {
  flex: 1;
  padding: 15px;
  border-radius: 16px;
}

.overworld { background: #1f6f5f; }
.nether { background: #7a1f1f; }
.end { background: #4b2a6f; }

.dimension button {
  background: white;
  margin: 8px 0;
}

#players {
  background: #1c1c1c;
  max-width: 500px;
  margin: 20px auto;
  padding: 15px;
  border-radius: 12px;
}

.player {
  background: #2a2a2a;
  padding: 8px;
  margin: 6px 0;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1>Proximity Chat</h1>

<div class="card" id="login">
  <input id="username" placeholder="Minecraft Username">
  <input id="password" type="password" placeholder="Room Password">
  <button id="joinBtn">Join Server</button>
</div>

<button id="muteBtn">Mute Mic</button>

<div id="app"></div>

<script>
const ROOM_PASSWORD = "BMS Minecraft";
const firebaseConfig = {
  apiKey: "AIzaSyCR0kIMG1QJzWMUh52UYduYoL9a-f_Db-w",
  authDomain: "proximity-chat-95107.firebaseapp.com",
  databaseURL: "https://proximity-chat-95107-default-rtdb.firebaseio.com",
  projectId: "proximity-chat-95107",
  storageBucket: "proximity-chat-95107.appspot.com",
  messagingSenderId: "347116592936",
  appId: "1:347116592936:web:4eb61da00f475c73a3fa1d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let name = "";
let stream;
let peer;
let calls = {};
let muted = false;

joinBtn.onclick = async () => {
  if (password.value !== ROOM_PASSWORD) return alert("Wrong password");
  name = username.value.trim();
  if (!name) return alert("Enter username");

  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  peer = new Peer();

  peer.on("call", call => {
    call.answer(stream);
    call.on("stream", s => playAudio(s, call.peer));
  });

  login.remove();
  muteBtn.style.display = "block";
  app.style.display = "block";
  renderApp();
};

muteBtn.onclick = () => {
  muted = !muted;
  stream.getAudioTracks()[0].enabled = !muted;
  muteBtn.textContent = muted ? "Unmute Mic" : "Mute Mic";
};

function renderApp() {
  app.innerHTML = `
    <div class="dimensions">
      ${dimension("Overworld","overworld")}
      ${dimension("Nether","nether")}
      ${dimension("End","end")}
    </div>
    <div id="players">
      <strong>Players in group</strong>
      <div id="playerList">Not in a group</div>
    </div>
  `;
  document.querySelectorAll("[data-group]").forEach(b =>
    b.onclick = () => joinGroup(b.dataset.group)
  );
}

function dimension(name, cls) {
  return `
    <div class="dimension ${cls}">
      <h2>${name}</h2>
      <button data-group="${name}/1">Group 1</button>
      <button data-group="${name}/2">Group 2</button>
      <button data-group="${name}/3">Group 3</button>
    </div>
  `;
}

function joinGroup(group) {
  Object.values(calls).forEach(c => c.close());
  calls = {};
  document.querySelectorAll("audio").forEach(a => a.remove());

  const ref = db.ref("groups/" + group + "/" + name);
  ref.set(peer.id);
  ref.onDisconnect().remove();

  db.ref("groups/" + group).on("value", snap => {
    const list = document.getElementById("playerList");
    list.innerHTML = "";
    const users = snap.val() || {};
    Object.keys(users).forEach(u => {
      const div = document.createElement("div");
      div.className = "player";
      div.textContent = u;
      list.appendChild(div);
      if (u !== name && !calls[u]) {
        const call = peer.call(users[u], stream);
        calls[u] = call;
        call.on("stream", s => playAudio(s, users[u]));
      }
    });
  });
}

function playAudio(stream, id) {
  if (document.getElementById(id)) return;
  const a = document.createElement("audio");
  a.id = id;
  a.srcObject = stream;
  a.autoplay = true;
  document.body.appendChild(a);
}
</script>

</body>
</html>
