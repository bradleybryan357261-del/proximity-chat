<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proximity Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { margin: 30px 0; }

.card {
  background: #1c1c1c;
  padding: 20px;
  max-width: 360px;
  margin: 30px auto;
  border-radius: 14px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#joinBtn { background: #4caf50; color: black; }
#muteBtn {
  display: none;
  background: #e91e63;
  color: white;
  max-width: 200px;
  margin: 20px auto;
}

#app { display: none; }

.dimensions {
  display: flex;
  gap: 20px;
  max-width: 1200px;
  margin: 30px auto;
}

.dimension {
  flex: 1;
  padding: 15px;
  border-radius: 16px;
}

.overworld { background: #1f6f5f; }
.nether { background: #7a1f1f; }
.end { background: #4b2a6f; }

.dimension button {
  background: white;
  margin: 8px 0;
}

#players {
  background: #1c1c1c;
  max-width: 500px;
  margin: 20px auto;
  padding: 15px;
  border-radius: 12px;
}

.player {
  background: #2a2a2a;
  padding: 8px;
  margin: 6px 0;
  border-radius: 6px;
}
</style>
</head>

<body>

<h1>Proximity Chat</h1>

<!-- LOGIN ONLY -->
<div class="card" id="login">
  <input id="username" placeholder="Minecraft Username">
  <input id="password" type="password" placeholder="Room Password">
  <button id="joinBtn">Join Server</button>
</div>

<button id="muteBtn">Mute Mic</button>

<!-- APP (CREATED AFTER LOGIN) -->
<div id="app"></div>

<script>
/* CONFIG */
const ROOM_PASSWORD = "BMS Minecraft";
const firebaseConfig = {
  apiKey: "AIzaSyCR0kIMG1QJzWMUh52UYduYoL9a-f_Db-w",
  authDomain: "proximity-chat-95107.firebaseapp.com",
  databaseURL: "https://proximity-chat-95107-default-rtdb.firebaseio.com",
  projectId: "proximity-chat-95107",
  storageBucket: "proximity-chat-95107.appspot.com",
  messagingSenderId: "347116592936",
  appId: "1:347116592936:web:4eb61da00f475c73a3fa1d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let name = "";
let currentRef = null;
let stream = null;
let muted = false;

/* LOGIN */
joinBtn.onclick = async () => {
  if (password.value !== ROOM_PASSWORD) return alert("Wrong password");
  name = username.value.trim();
  if (!name) return alert("Enter username");

  stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  login.remove();
  muteBtn.style.display = "block";
  app.style.display = "block";

  renderApp();
};

/* MUTE */
muteBtn.onclick = () => {
  muted = !muted;
  stream.getAudioTracks()[0].enabled = !muted;
  muteBtn.textContent = muted ? "Unmute Mic" : "Mute Mic";
};

/* BUILD UI AFTER LOGIN */
function renderApp() {
  app.innerHTML = `
    <div class="dimensions">
      ${makeDimension("Overworld","overworld")}
      ${makeDimension("Nether","nether")}
      ${makeDimension("End","end")}
    </div>

    <div id="players">
      <strong>Players in group</strong>
      <div id="playerList">Not in a group</div>
    </div>
  `;

  document.querySelectorAll("[data-path]").forEach(btn => {
    btn.onclick = () => joinGroup(btn.dataset.path);
  });
}

function makeDimension(name, cls) {
  return `
    <div class="dimension ${cls}">
      <h2>${name}</h2>
      <button data-path="${name}/1">Group 1</button>
      <button data-path="${name}/2">Group 2</button>
      <button data-path="${name}/3">Group 3</button>
    </div>
  `;
}

/* GROUP JOIN */
function joinGroup(path) {
  if (currentRef) currentRef.remove();

  const ref = db.ref("groups/" + path + "/" + name);
  currentRef = ref;
  ref.set(true);
  ref.onDisconnect().remove();

  db.ref("groups/" + path).on("value", snap => {
    const list = document.getElementById("playerList");
    list.innerHTML = "";
    const data = snap.val() || {};
    Object.keys(data).forEach(p => {
      const d = document.createElement("div");
      d.className = "player";
      d.textContent = p;
      list.appendChild(d);
    });
  });
}
</script>

</body>
</html>
