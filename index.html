<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proximity Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<style>
body {
  margin: 0;
  background: #0e0e0e;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* ---------- DESKTOP DEFAULT ---------- */
h1 {
  margin-top: 30px;
  font-size: 32px;
}

.card {
  background: #1c1c1c;
  width: 360px;
  margin: 40px auto;
  padding: 22px;
  border-radius: 18px;
}

input {
  width: 100%;
  padding: 16px;
  margin: 12px 0;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  border-radius: 14px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

#joinBtn { background: #4caf50; color: black; }

#muteBtn {
  display: none;
  background: #e91e63;
  color: white;
  max-width: 260px;
  margin: 20px auto;
}

/* ---------- PHONE MODE: GIANT ---------- */
@media (max-width: 600px) {

  h1 {
    font-size: 56px;
    margin-top: 40px;
  }

  .card {
    width: 94vw;              /* almost full screen */
    padding: 60px;            /* BIG padding */
    border-radius: 32px;
  }

  input {
    padding: 34px;
    font-size: 30px;
    margin: 24px 0;
    border-radius: 22px;
  }

  button {
    padding: 34px;
    font-size: 30px;
    border-radius: 26px;
    margin-top: 26px;
  }
}

/* ---------- APP ---------- */
#app { display: none; }

.dimensions {
  display: flex;
  gap: 20px;
  max-width: 1200px;
  margin: 30px auto;
}

.dimension {
  flex: 1;
  padding: 18px;
  border-radius: 20px;
}

.overworld { background: #1f6f5f; }
.nether { background: #7a1f1f; }
.end { background: #4b2a6f; }

.dimension button {
  background: white;
  margin: 10px 0;
}

#players {
  background: #1c1c1c;
  max-width: 560px;
  margin: 30px auto;
  padding: 20px;
  border-radius: 18px;
}

.player {
  background: #2a2a2a;
  padding: 12px;
  margin: 8px 0;
  border-radius: 12px;
}

.talking {
  border: 3px solid #4caf50;
  box-shadow: 0 0 20px #4caf50;
}
</style>
</head>

<body>

<h1>Proximity Chat</h1>

<div class="card" id="login">
  <input id="username" placeholder="Minecraft Username">
  <input id="password" type="password" placeholder="Room Password">
  <button id="joinBtn">Join Server</button>
</div>

<button id="muteBtn">Mute Mic</button>
<div id="app"></div>

<script>
const ROOM_PASSWORD = "BMS Minecraft";

const firebaseConfig = {
  apiKey: "AIzaSyCR0kIMG1QJzWMUh52UYduYoL9a-f_Db-w",
  authDomain: "proximity-chat-95107.firebaseapp.com",
  databaseURL: "https://proximity-chat-95107-default-rtdb.firebaseio.com",
  projectId: "proximity-chat-95107",
  storageBucket: "proximity-chat-95107.appspot.com",
  messagingSenderId: "347116592936",
  appId: "1:347116592936:web:4eb61da00f475c73a3fa1d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let name="", stream, peer, group="", calls={}, muted=false;
let analyser, data;

joinBtn.onclick = async () => {
  if (password.value !== ROOM_PASSWORD) return alert("Wrong password");
  name = username.value.trim();
  if (!name) return alert("Enter username");

  stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  startVoiceDetect(stream);

  peer = new Peer();
  peer.on("call", c=>{
    c.answer(stream);
    c.on("stream", s=>play(s,c.peer));
  });

  login.remove();
  muteBtn.style.display="block";
  app.style.display="block";
  drawApp();
};

muteBtn.onclick = ()=>{
  muted=!muted;
  stream.getAudioTracks()[0].enabled=!muted;
  muteBtn.textContent = muted ? "Unmute Mic" : "Mute Mic";
};

function drawApp(){
  app.innerHTML=`
  <div class="dimensions">
    ${dim("Overworld","overworld")}
    ${dim("Nether","nether")}
    ${dim("End","end")}
  </div>
  <div id="players">
    <strong>Players in group</strong>
    <div id="list">Not in group</div>
  </div>`;
  document.querySelectorAll("[data-g]").forEach(b=>{
    b.onclick=()=>join(b.dataset.g);
  });
}

function dim(n,c){
  return `<div class="dimension ${c}">
    <h2>${n}</h2>
    <button data-g="${n}/1">Group 1</button>
    <button data-g="${n}/2">Group 2</button>
    <button data-g="${n}/3">Group 3</button>
  </div>`;
}

function join(g){
  leave();
  group=g;
  const r=db.ref("groups/"+g+"/"+name);
  r.set({peer:peer.id,talking:false});
  r.onDisconnect().remove();

  db.ref("groups/"+g).on("value",s=>{
    const list=document.getElementById("list");
    list.innerHTML="";
    const u=s.val()||{};
    Object.keys(u).forEach(p=>{
      const d=document.createElement("div");
      d.className="player"+(u[p].talking?" talking":"");
      d.textContent=p;
      list.appendChild(d);
      if(p!==name&&!calls[p]){
        const c=peer.call(u[p].peer,stream);
        calls[p]=c;
        c.on("stream",st=>play(st,u[p].peer));
      }
    });
  });
}

function leave(){
  Object.values(calls).forEach(c=>c.close());
  calls={};
  document.querySelectorAll("audio").forEach(a=>a.remove());
}

function play(s,id){
  if(document.getElementById(id))return;
  const a=document.createElement("audio");
  a.id=id;a.srcObject=s;a.autoplay=true;
  document.body.appendChild(a);
}

function startVoiceDetect(s){
  const ctx=new AudioContext();
  analyser=ctx.createAnalyser();
  const src=ctx.createMediaStreamSource(s);
  analyser.fftSize=256;
  src.connect(analyser);
  data=new Uint8Array(analyser.frequencyBinCount);
  (function loop(){
    analyser.getByteFrequencyData(data);
    const v=data.reduce((a,b)=>a+b)/data.length;
    if(group&&name)
      db.ref("groups/"+group+"/"+name+"/talking").set(v>20&&!muted);
    requestAnimationFrame(loop);
  })();
}
</script>

</body>
</html>
