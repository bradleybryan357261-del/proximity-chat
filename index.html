<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NUCLEAR Proximity Chat</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<style>
/* 🔥 NUCLEAR VISUAL PROOF */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #8b0000; /* DARK RED */
  color: white;
}

#version {
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  background: yellow;
  color: black;
  padding: 20px;
}

/* LOGIN */
#login {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 80vh;
}

.login-card {
  background: #111;
  border-radius: 20px;
  padding: 40px;
  width: 400px;
  text-align: center;
}

.login-card h1 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  background: #4caf50;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.96);
}

/* GROUPS (hidden until login) */
#groups {
  display: none;
  padding: 20px;
}

.group-grid {
  display: grid;
  gap: 20px;
}

@media (min-width: 900px) {
  .group-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

.group {
  padding: 20px;
  border-radius: 16px;
}

.overworld { background: #1f6f5f; }
.nether { background: #7a1f1f; }
.end { background: #4b2a6f; }

/* 📱 PHONE = ABSURDLY BIG */
@media (max-width: 600px) {
  .login-card {
    width: 95%;
    padding: 60px;
  }

  .login-card h1 {
    font-size: 36px;
  }

  input {
    font-size: 26px;
    padding: 24px;
  }

  button {
    font-size: 28px;
    padding: 26px;
  }
}
</style>
</head>

<body>

<div id="version">☢️ NUCLEAR VERSION — IF YOU SEE THIS, IT UPDATED ☢️</div>

<div id="login">
  <div class="login-card">
    <h1>Proximity Chat</h1>
    <input id="username" placeholder="Minecraft Username">
    <input id="password" type="password" placeholder="Room Password">
    <button onclick="join()">JOIN</button>
  </div>
</div>

<div id="groups">
  <h2 style="text-align:center;">Choose a Group</h2>
  <div class="group-grid">
    <div class="group overworld">Overworld – Group 1</div>
    <div class="group overworld">Overworld – Group 2</div>
    <div class="group overworld">Overworld – Group 3</div>

    <div class="group nether">Nether – Group 1</div>
    <div class="group nether">Nether – Group 2</div>
    <div class="group nether">Nether – Group 3</div>

    <div class="group end">End – Group 1</div>
    <div class="group end">End – Group 2</div>
    <div class="group end">End – Group 3</div>
  </div>
</div>

<script>
const ROOM_PASSWORD = "BMS Minecraft";

function join() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;

  if (!user) return alert("Enter username");
  if (pass !== ROOM_PASSWORD) return alert("Wrong password");

  document.getElementById("login").remove();
  document.getElementById("groups").style.display = "block";
}
</script>

</body>
</html>
